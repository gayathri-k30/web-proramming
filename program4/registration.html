<html>
<head>
<title>registration form</title>
<style>
body
{
background-color:lightblue;
width:700px;
margin:auto;
}
td
{
padding:10px;
}
</style>
</head>
<body>
<h2 align="center">registration form</h2>
<form>
<table>
<tr>
<td>full name</td>
<td><input type="text"></td>
</tr>
<tr>
<td>mobile number</td>
<td><input type="number"></td>
</tr>
<tr>
<td>age</td>
<td><input type="number"></td>
</tr>
<tr>
<td>gender</td>
<td><input type="radio" name="gender">male
<input type="radio" name="gender">female
<input type="radio" name="gender">others</td>
</tr>
<td>date of birth</td>
<td><input type="date"></td>
</tr>
<tr>
<td>address</td>
<td><textarea rows="8" cols="25"></textarea></td>
</tr>
<tr>
<td>current study</td>
<td><select>
<option>b.tech</option>
<option>m.tech</option>
<option>bca</option>
<option>mca</option>
</select>
</td>
</tr>
<tr>
<td>department</td>
<td>
<select>
<option>cs</option>
<option>it</option>
<option>ec</option>
<option>eee</option>
</select>
</td>
</tr>
<td>upload cv</td>
<td><input type="file"></td>
</tr>
<tr>
<td>programming languages</td>
<td><input type="checkbox">html
<input type="checkbox">reactjs
<input type="checkbox">css
<input type="checkbox">flutter
</td>
</tr>
<td>languge</td>
<td><input type="checkbox">english
<input type="checkbox">malayalam
<input type="checkbox">hindi
</td>
</tr>
<tr>
<td><input type="submit" value="submit">
</td>
<td>
<input type="reset" value="reset">
</td>
</tr>
</table>
</form>
</body>
</html>
